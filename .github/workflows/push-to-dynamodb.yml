# Make the DynamoDB table match data/ on main. The table is live for both bots.
# Logic: src/push_to_dynamodb.py.
#
# Manual dispatch only, from main. mode defaults to plan.
#   plan  - read role, no environment: prints the per-item diff to the job
#           summary. Plan mode stops here.
#   apply - write role (also trusts ...:ref:refs/heads/main): re-plans and writes the
#           items that differ. Never deletes table items.
name: Push to DynamoDB

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan: show what would change, write nothing. apply: plan, then write."
        type: choice
        options: [plan, apply]
        default: plan

permissions: {}

defaults:
  run:
    shell: bash  # GitHub runs this as bash -eo pipefail

concurrency:
  group: dynamodb-push
  cancel-in-progress: false

jobs:
  plan:
    # No environment: the read role trusts ...:ref:refs/heads/main.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main; this run is on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.DYNAMODB_READ_ROLE_ARN }}
          aws-region: us-east-2

      - name: Plan
        working-directory: src
        run: python -m push_to_dynamodb

  apply:
    needs: plan
    if: ${{ inputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    # No environment: the write role trusts ...:ref:refs/heads/main.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main; this run is on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.DYNAMODB_WRITE_ROLE_ARN }}
          aws-region: us-east-2

      - name: Apply
        working-directory: src
        run: python -m push_to_dynamodb --apply
