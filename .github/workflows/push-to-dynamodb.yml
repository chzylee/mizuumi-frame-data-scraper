# Write data/ on main to the DynamoDB table. The table is live for both bots;
# the dry run is the only preview. Logic: src/push_to_dynamodb.py.
#
# Jobs:
#   plan  - always runs: read role, no environment, dry run. Its job summary
#           is the plan to review before approving `write`.
#   write - only when dry_run is false: `dynamodb` environment (required
#           reviewers), write role. Re-plans against the live table, writes,
#           and on full success moves the dynamodb-deployed tag to this commit.
name: Push to DynamoDB

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: plan only, write nothing"
        type: boolean
        default: true
      force:
        description: "Items to overwrite despite drift, comma-separated (e.g. akiha-C,ciel-H)"
        type: string
        default: ""
      allow_move_removal:
        description: "Items allowed to lose moves, comma-separated"
        type: string
        default: ""

permissions: {}

concurrency:
  group: dynamodb-push
  cancel-in-progress: false

jobs:
  plan:
    # No environment: the read role trusts ...:ref:refs/heads/main.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main; this run is on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history + tags: the drift baseline is read from git

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.DYNAMODB_READ_ROLE_ARN }}
          aws-region: us-east-2

      - name: Plan (dry run)
        working-directory: src
        env:
          FORCE: ${{ inputs.force }}
          ALLOW_MOVE_REMOVAL: ${{ inputs.allow_move_removal }}
        run: |
          python -m push_to_dynamodb --head "$GITHUB_SHA" \
            --force "$FORCE" --allow-move-removal "$ALLOW_MOVE_REMOVAL"

  write:
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: dynamodb  # write role trusts ...:environment:dynamodb
    permissions:
      contents: write  # move the dynamodb-deployed tag
      id-token: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main; this run is on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.DYNAMODB_WRITE_ROLE_ARN }}
          aws-region: us-east-2

      - name: Write
        working-directory: src
        env:
          FORCE: ${{ inputs.force }}
          ALLOW_MOVE_REMOVAL: ${{ inputs.allow_move_removal }}
        # Exits non-zero if any item was refused or conflicted, which skips the
        # tag move below.
        run: |
          python -m push_to_dynamodb --write --head "$GITHUB_SHA" \
            --force "$FORCE" --allow-move-removal "$ALLOW_MOVE_REMOVAL"

      - name: Move dynamodb-deployed tag to this commit
        run: |
          git tag -f dynamodb-deployed "$GITHUB_SHA"
          git push --force origin refs/tags/dynamodb-deployed
